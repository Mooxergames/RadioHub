<!doctype html><html lang="tr"><meta charset="utf-8"><title>Mega Radio · Bildirim merkezi · Cihaz karşılaştırması</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 45%,#222326,#0c0d0f);color:#f7f8fc;font:14px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:18px}h1{font-size:17px;font-weight:500;margin:0}.devices{display:flex;gap:48px;align-items:flex-start;justify-content:center}.preview{text-align:center}.label{margin-bottom:14px;color:#b8b8be;font-size:13px}.slot{position:relative}.phone{position:absolute;top:0;left:0;transform:scale(var(--scale));transform-origin:top left;border:5px solid #a7a69f;border-radius:66px;background:#080808;padding:9px;box-shadow:0 18px 52px #0009,inset 0 0 0 3px #464542}.screen{position:relative;overflow:hidden;background:#1B1C1E}.status{position:absolute;inset:0 0 auto;z-index:2;color:#fff;display:flex;justify-content:space-between;font-weight:600}.status img{width:67px;height:12px;margin-top:4px}.island{position:absolute;width:126px;height:36px;top:11px;left:50%;transform:translateX(-50%);border-radius:24px;background:#000;z-index:3}.island:after{content:'';position:absolute;right:12px;top:12px;width:9px;height:9px;border-radius:50%;background:radial-gradient(#193550,#03070a)}iframe{border:0;position:absolute;left:0;background:#1B1C1E}.home{position:absolute;bottom:0;width:100%;height:34px;background:#1B1C1E}.home:after{content:'';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:4px;background:#f7f7fa}.se{border-radius:53px;padding-top:50px;padding-bottom:58px}.se:after{content:'';position:absolute;width:41px;height:41px;border:2px solid #3b3b3d;border-radius:50%;bottom:8px;left:50%;transform:translateX(-50%)}.se:before{content:'';position:absolute;width:48px;height:5px;border-radius:4px;background:#2a2b2d;top:23px;left:50%;transform:translateX(-50%)}.hint{font-size:12px;color:#8e8e98;margin:0;text-align:center}
</style>
<h1>Bildirim merkezi</h1><main class="devices">
<section class="preview"><div class="label">iPhone 15 · 393 × 852</div><div class="slot" data-width="421" data-height="880"><div class="phone" style="width:421px;height:880px"><div class="screen" style="width:393px;height:852px;border-radius:52px"><div class="status" style="height:59px;padding:17px 29px"><span>9:41</span><img src="status-icons.svg" alt=""></div><div class="island"></div><iframe title="iPhone 15 · Bildirim merkezi" src="http://localhost:8081/notifications?previewExamples=1" style="width:393px;height:759px;top:59px"></iframe><div class="home"></div></div></div></div></section>
<section class="preview"><div class="label">iPhone SE · 375 × 667</div><div class="slot" data-width="403" data-height="785"><div class="phone se" style="width:403px;height:785px"><div class="screen" style="width:375px;height:667px;border-radius:3px"><div class="status" style="height:20px;padding:0 12px;font-size:12px;align-items:center"><span>9:41</span><img src="status-icons.svg" alt="" style="margin-top:0;height:10px;width:60px"></div><iframe title="iPhone SE · Bildirim merkezi" src="http://localhost:8081/notifications?previewExamples=1" style="width:375px;height:647px;top:20px"></iframe></div></div></div></section>
</main><p class="hint">Aynı ekran, gerçek cihaz genişliklerinde. Her telefonun içi bağımsız kaydırılabilir.</p>
<script>function fit(){const scale=Math.min(1,(innerHeight-130)/880,(innerWidth-100)/872);document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('.slot').forEach(el=>{el.style.width=Number(el.dataset.width)*scale+'px';el.style.height=Number(el.dataset.height)*scale+'px'})}fit();addEventListener('resize',fit)</script></html>
