<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Radio · Home cihaz önizlemesi</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse,#202124,#0c0d0f);color:#eee;font:14px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}h1{font-size:17px;font-weight:500;margin:0}#slot{position:relative}#phone{position:absolute;top:0;left:0;transform-origin:top left;border:5px solid #a7a69f;border-radius:54px;background:#080808;padding:9px;box-shadow:0 18px 52px #0009}#screen{position:relative;overflow:hidden;background:#1B1C1E;border-radius:40px}#status{position:absolute;inset:0 0 auto;z-index:2;display:flex;justify-content:space-between;color:white;font-size:14px;font-weight:600}#status.premium-transition:before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(19,19,19,.05),rgba(19,19,19,.4) 40%,#131313) 0 0/var(--preview-width) var(--preview-hero-height) no-repeat,url(premium-hero.svg) right top/var(--preview-width) auto no-repeat #131313;opacity:var(--premium-progress,0);pointer-events:none}#status>span,#status>img{position:relative;z-index:1}#status img{width:67px;height:12px;margin-top:3px}#camera{position:absolute;left:50%;transform:translateX(-50%);background:#000;z-index:3}iframe{position:absolute;border:0;left:0;width:100%;background:#1B1C1E}#home{position:absolute;bottom:0;left:0;width:100%;background:#171717}#screen.ads:before{content:'';position:absolute;top:0;left:0;width:100%;height:var(--preview-ads-height);background:url(remove-ads-hero.png) top /var(--preview-width) auto;z-index:2;pointer-events:none}#home:after{opacity:var(--photo-indicator-opacity,1);content:'';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);height:4px;width:32%;border-radius:4px;background:#f7f7fa}.hint{font-size:12px;color:#a0a0a8;text-align:center;margin:0;max-width:440px}</style>
<h1 id="label"></h1><main id="slot"><div id="phone"><div id="screen"><div id="status"><span>9:41</span><img src="status-icons.svg" alt=""></div><div id="camera"></div><iframe title="Mega Radio Home"></iframe><div id="home"></div></div></div></main><p class="hint">Gerçek uygulama · Telefonun içinde kaydır.<br>Tarayıcıda ekran boyutu kontrolü; cihazın yerel işletim sistemi testi değildir.</p>
<script src="preview-theme.js"></script><script>
const profiles={iphone15pro:{name:'iPhone 15 Pro',w:393,h:852,top:59,bottom:34,ios:true},galaxys8:{name:'Samsung Galaxy S8 · dar Android',w:360,h:740,top:24,bottom:24},pixel7:{name:'Google Pixel 7 · Android',w:412,h:915,top:24,bottom:24},compact:{name:'Kompakt Android · en dar kontrol',w:320,h:640,top:24,bottom:24},duoclosed:{name:'iPhone Duo · kapalı / dış ekran',w:466,h:678,top:24,bottom:21,ios:true,duo:true},duoopen:{name:'iPhone Duo · açık / iç ekran',w:890,h:626,top:24,bottom:21,ios:true,duo:true,inner:true},xiaomi13:{name:'Xiaomi 13 · Android',w:393,h:873,top:24,bottom:24},oneplus9:{name:'OnePlus 9 · Android',w:412,h:915,top:24,bottom:24},huaweip30:{name:'Huawei P30 · Android',w:360,h:780,top:24,bottom:24},xperia5ii:{name:'Sony Xperia 5 II · uzun ekran',w:360,h:840,top:24,bottom:24}};
const p=profiles[new URLSearchParams(location.search).get('device')]||profiles.iphone15pro;
const slot=document.getElementById('slot'),phone=document.getElementById('phone'),screen=document.getElementById('screen'),status=document.getElementById('status'),home=document.getElementById('home'),camera=document.getElementById('camera'),frame=document.querySelector('iframe');
document.title='Mega Radio · Home · '+p.name;document.getElementById('label').textContent=p.name+' · '+p.w+' × '+p.h;
phone.style.width=(p.w+28)+'px';phone.style.height=(p.h+28)+'px';screen.style.width=p.w+'px';screen.style.height=p.h+'px';status.style.height=(p.top+6)+'px';status.style.padding=p.ios&&!p.duo?'17px 29px':'2px 18px';home.style.height=p.bottom+'px';frame.style.top=p.top+'px';frame.style.height=(p.h-p.top-p.bottom)+'px';frame.name='mega-preview:'+JSON.stringify({top:p.top,bottom:p.bottom,width:p.w,height:p.h});const screenRoute={privateDiscovery:'messages?previewChat=1&userId=demo-0&previewDiscovery=1',home:'',player:'player?preview=1',premium:'player?preview=1&premium=1',sleep:'player?preview=1&sleep=1'}[new URLSearchParams(location.search).get('screen')||'home']||'';frame.src=MegaPreviewTheme.url('http://localhost:8081/'+screenRoute,{top:p.top,bottom:p.bottom,width:p.w,height:p.h});camera.style.cssText+=p.duo?(p.inner?';display:none':';top:6px;left:auto;right:10px;transform:none;width:10px;height:10px;border-radius:50%'):p.ios?';top:11px;width:126px;height:36px;border-radius:24px':';top:5px;width:10px;height:10px;border-radius:50%';
if(p.duo){document.querySelector('.hint').textContent='Gerçek uygulama · Telefonun içinde kaydır. Apple panel ölçülerinden @3x boyut kontrolü; sistem çubukları ve katlanma davranışı simülasyonu değildir.';}
const previewTheme=MegaPreviewTheme.attach({width:p.w,height:p.h,top:p.top,bottom:p.bottom,flags:{home:true,tabDock:true}});function theme(){previewTheme.render()}
function fit(){const scale=Math.min(1,(innerWidth-36)/(p.w+28),(innerHeight-125)/(p.h+28));slot.style.width=(p.w+28)*scale+'px';slot.style.height=(p.h+28)*scale+'px';phone.style.transform='scale('+scale+')'}theme();fit();addEventListener('resize',fit);
</script></html>
